name: Test
on: [push, pull_request]

jobs:
  test:
    # Only run this job when executing on GitHub's infrastructure
    if: github.server_url == 'https://github.com'

    strategy:
      matrix:
        go-version: [1.27.x]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd

    steps:
      - name: Setup Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libsdl2-dev pkg-config

      # Ubuntu's apt repo only ships OpenImageIO 2.4, but the wrapper in
      # internal/oiio targets the 3.1 API, so pull 3.1 from conda.
      - name: Install OpenImageIO 3.1 (conda-forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Configure OpenImageIO 3.1 for cgo
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge "openimageio=3.1.17" fmt
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SIMD Support
        run: |
          echo "Go version: $(go version)"
          echo "GOEXPERIMENT: $GOEXPERIMENT"
          go env GOEXPERIMENT

      - name: Test
        run: go test -v -race ./...

      - name: Test SIMD Correctness
        run: go test -v ./internal/hitable -run TestRayAABB4_SIMD

      - name: Format
        run: diff -u <(echo -n) <(gofmt -d .)
